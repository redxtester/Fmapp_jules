name: fmapp
description: "Personal Multi-SIM Finance & Loan Manager."
# Prevent accidental publishing to pub.dev.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Adjusted to a common modern SDK range

dependencies:
  flutter:
    sdk: flutter

  # State Management - Riverpod
  flutter_riverpod: ^2.5.1 # Use a recent version
  riverpod_annotation: ^2.3.5 # For code generation with Riverpod

  # Supabase
  supabase_flutter: ^2.5.0 # Use a recent version

  # Local Database - Isar
  isar: ^3.1.0+1 # Use a recent version
  isar_flutter_libs: ^3.1.0+1 # Contains native Isar binaries
  path_provider: ^2.0.0 # To find the correct directory for Isar

  # Model comparison & utility
  equatable: ^2.0.5

  # Internationalization (will be needed for ETB currency, dates etc.)
  intl: ^0.19.0

  # UUID generation
  uuid: ^4.4.0 # Check for latest version


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0 # Or a more recent version
  build_runner: ^2.4.0 # For code generation
  isar_generator: ^3.1.0+1 # For Isar object generation
  riverpod_generator: ^2.4.0 # For Riverpod provider generation
  mockito: ^5.4.4 # For generating mocks for testing

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware
  #
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
